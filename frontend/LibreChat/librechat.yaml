version: 1.3.13

cache: true

endpoints:
  custom:
    - name: 'DeepSeek'
      apiKey: '${DEEPSEEK_API_KEY}'
      baseURL: 'https://api.deepseek.com/v1'

      models:
        default:
          - deepseek-chat
          - deepseek-reasoner
          - deepseek-coder
        fetch: false

      titleConvo: true
      titleModel: 'deepseek-chat'
      modelDisplayLabel: 'DeepSeek'

mcpSettings:
  allowedAddresses:
    - 'host.docker.internal:3333'

mcpServers:
  sherlook-mcp:
    type: streamable-http
    url: 'http://host.docker.internal:3333/mcp'
