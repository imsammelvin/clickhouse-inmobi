name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck


  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          cat > ~/.ssh/key <<'EOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          EOF

          chmod 600 ~/.ssh/key

          ssh-keyscan \
            -p "${{ secrets.SSH_PORT || 22 }}" \
            -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts


      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/key \
            -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo SSH_WORKING && pwd"


      - name: Sync code to server
        run: |
          rsync -az \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            -e "ssh -i ~/.ssh/key -p ${{ secrets.SSH_PORT || 22 }}" \
            ./ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/clickhouse-inmobi/"


      - name: Restart application
        run: |
          ssh \
            -i ~/.ssh/key \
            -p "${{ secrets.SSH_PORT || 22 }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" <<'EOF'

          set -e

          export PATH="$HOME/.bun/bin:$PATH"

          cd ~/clickhouse-inmobi

          bun install --frozen-lockfile

          export PORT=2345
          export MCP_PORT=3333
          export NODE_ENV=production

          pm2 delete inmobi-api 2>/dev/null || true
          pm2 delete inmobi-mcp 2>/dev/null || true

          pm2 start api/server.ts \
            --name inmobi-api \
            --interpreter "$(command -v bun)"

          pm2 start mcp/server.ts \
            --name inmobi-mcp \
            --interpreter "$(command -v bun)" \
            -- --transport http --port 3333

          pm2 save --force

          pm2 status

          EOF