name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -H -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync project to server
        run: |
          rsync -az --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            -e "ssh -i ~/.ssh/key -p ${{ secrets.SSH_PORT }}" \
            ./ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Restart application
        run: |
          ssh -i ~/.ssh/key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" <<'EOF'
          set -e

          export PATH="$HOME/.bun/bin:$PATH"

          cd "${{ secrets.DEPLOY_PATH }}"

          bun install --frozen-lockfile

          export PORT=2345
          export MCP_PORT=3333
          export NODE_ENV=production

          pm2 delete inmobi-api 2>/dev/null || true
          pm2 delete inmobi-mcp 2>/dev/null || true

          pm2 start api/server.ts \
            --name inmobi-api \
            --interpreter "$(command -v bun)"

          pm2 start mcp/server.ts \
            --name inmobi-mcp \
            --interpreter "$(command -v bun)" \
            -- --transport http --port 3333

          pm2 save --force
          pm2 status
          EOF